server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash: cachear agresivamente
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida sirve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No cachear el index para que los deploys se reflejen
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
